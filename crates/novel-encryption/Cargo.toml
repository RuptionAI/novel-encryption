[package]
name = "novel-encryption"
description = "Novel Encryption: memorable, chain-checked keys drawn from a novel, sealed with Argon2id + XChaCha20-Poly1305"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["encryption", "passphrase", "argon2", "xchacha20poly1305", "book-cipher"]
categories = ["cryptography"]

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
getrandom = "0.2"
unicode-normalization = "0.1"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
thiserror = "2"

[dev-dependencies]
hex = "0.4"
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
